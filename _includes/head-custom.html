<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<script>
document.addEventListener('DOMContentLoaded', function () {
  if (window.matchMedia('(hover: none)').matches) return;

  // đỉnh mũi tên nằm ở (3,3) trong SVG 44x44
  var HX = 3, HY = 3;
  var INTERACTIVE = 'a, button, .card, .nav-link, .post-tag, summary, label, [role="button"]';

  var arrow = document.createElement('div');
  arrow.id = 'cursor-arrow';
  arrow.innerHTML =
    '<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44">' +
    '<path class="tail" d="M14 15 C15 27 15 34 25 34 C34 34 37 31 40 41"/>' +
    '<path class="head" d="M3 3 L21 8 L8 21 Z"/>' +
    '</svg>';
  document.body.appendChild(arrow);

  var glow = document.createElement('div');
  glow.id = 'cursor-glow';
  document.body.appendChild(glow);

  var x = -100, y = -100, gx = -100, gy = -100, last = 0, started = false;

  function show() { arrow.classList.add('show'); glow.classList.add('show'); }
  function hide() { arrow.classList.remove('show'); glow.classList.remove('show'); }

  document.addEventListener('pointermove', function (e) {
    if (e.pointerType === 'touch') return;
    x = e.clientX;
    y = e.clientY;

    if (!started) {
      started = true;
      gx = x; gy = y;
      document.documentElement.classList.add('has-cursor');
    }
    show();

    var now = Date.now();
    if (now - last > 40) {
      last = now;
      var t = document.createElement('div');
      t.className = 'cursor-trail';
      t.style.left = (x - 3) + 'px';
      t.style.top = (y - 3) + 'px';
      document.body.appendChild(t);
      setTimeout(function () { t.remove(); }, 600);
    }
  }, { passive: true });

  (function loop() {
    gx += (x - gx) * 0.18;
    gy += (y - gy) * 0.18;
    arrow.style.transform = 'translate(' + (x - HX) + 'px,' + (y - HY) + 'px)';
    glow.style.transform = 'translate(' + gx + 'px,' + gy + 'px)';
    requestAnimationFrame(loop);
  })();

  function setHover(on) {
    arrow.classList.toggle('hover', on);
    glow.classList.toggle('hover', on);
  }
  document.addEventListener('mouseover', function (e) {
    setHover(!!(e.target.closest && e.target.closest(INTERACTIVE)));
  });

  // chuột rời cửa sổ hoặc đổi tab thì ẩn, quay lại thì hiện
  document.documentElement.addEventListener('mouseleave', hide);
  document.documentElement.addEventListener('mouseenter', function () { if (started) show(); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) hide(); });
  window.addEventListener('blur', hide);

  document.addEventListener('mousedown', function () { glow.style.borderColor = '#fff'; });
  document.addEventListener('mouseup', function () { glow.style.borderColor = ''; });
});
</script>
